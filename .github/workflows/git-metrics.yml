name: Metrics
on:
  # Schedule updates every 12 hours
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Minimalist Metrics Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-metrics.svg

          # Layout Configuration
          user: mani-hash
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo

          # Visual Theme Tuning
          theme: tokyonight
          config_padding: 0, 8
          
          # Private Data Syncing Engine
          config_order: base.header, base.activity
          plugin_lines: yes
          plugin_followup: yes
          
          # Resolve hidden stats
          include_all_commits: true
          count_private: true

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_skipped: tex, markdown, html, css